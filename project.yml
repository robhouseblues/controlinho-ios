    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsikadatech.controlinho
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        # Google's sample IDs, which only ever show test ads, so tapping them while
        # developing is safe.
        Debug:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174
        # Replace these with the app ID and banner ad unit ID from your AdMob account
        # before submitting to the App Store.
        Release:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174

  ControlinhoControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - ControlinhoControls
      # Shared with the app: the saved TV, socket helpers and Wake-on-LAN.
      - Controlinho/Models/TVKey.swift
      - Controlinho/Services/SharedStore.swift
      - Controlinho/Services/LGConnection.swift
      - Controlinho/Services/LocalNetwork.swift
    entitlements:
      path: ControlinhoControls/ControlinhoControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tsikadatech.controlinho
    info:
      path: ControlinhoControls/Info.plist
      properties:
        CFBundleDisplayName: Controlinho
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: Controlinho needs local network access to control your TV.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsikadatech.controlinho.controls
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
