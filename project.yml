name: Controlinho
options:
  bundleIdPrefix: com.tsikadatech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
targets:
  Controlinho:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - Controlinho
    dependencies:
      - target: ControlinhoControls
      - package: GoogleMobileAds
    scheme:
      # Lets Xcode test the Plus purchase without App Store Connect.
      storeKitConfiguration: Config/Controlinho.storekit
    entitlements:
      path: Controlinho/Controlinho.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tsikadatech.controlinho
    info:
      path: Controlinho/Info.plist
      properties:
        CFBundleDisplayName: Controlinho
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - PixelifySans.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Controlinho needs local network access to find and control your TV.
        NSUserTrackingUsageDescription: This lets the free version of Controlinho show ads that are more relevant to you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Ads in the free version (AdMob).
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdMobBannerUnitID: $(ADMOB_BANNER_UNIT_ID)
        # Ad networks AdMob works with, from developers.google.com/admob/ios/quick-start.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
