name: Controlinho
options:
  bundleIdPrefix: com.robhouseblues
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Controlinho:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - Controlinho
    dependencies:
      - target: ControlinhoControls
    entitlements:
      path: Controlinho/Controlinho.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.robhouseblues.controlinho
    info:
      path: Controlinho/Info.plist
      properties:
        CFBundleDisplayName: Controlinho
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - PixelifySans.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Controlinho needs local network access to find and control your Samsung TV.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robhouseblues.controlinho
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  ControlinhoControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - ControlinhoControls
      # Shared with the app: the saved TV, socket helpers and Wake-on-LAN.
      - Controlinho/Models/TVKey.swift
      - Controlinho/Services/SharedStore.swift
      - Controlinho/Services/LocalNetwork.swift
    entitlements:
      path: ControlinhoControls/ControlinhoControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.robhouseblues.controlinho
    info:
      path: ControlinhoControls/Info.plist
      properties:
        CFBundleDisplayName: Controlinho
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: Controlinho needs local network access to control your Samsung TV.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robhouseblues.controlinho.controls
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
